name: UAB bug report
description: Report a reproducible Universal Adaptive Backporter problem.
body:
  - type: input
    id: version
    attributes:
      label: Exact UAB JAR filename
      placeholder: uab-4.0.0+mc1.7.10.jar
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft, Forge, Java and relevant mod versions
      description: Include UniMixins and any rendering, terrain or server-platform modifications.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include relevant UAB settings. For generation issues include the seed, dimension and coordinates.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and crash report
      description: Link the complete relevant logs and crash report. Mention whether this uses an upgraded or fresh world.
    validations:
      required: false
